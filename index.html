<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cinematic Rain & Hug Scene</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #080a0f;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }
        #viewport {
            position: relative;
            width: 854px;
            height: 480px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.9), 0 0 40px rgba(60, 110, 180, 0.15);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        #startOverlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(8, 10, 15, 0.85);
            backdrop-filter: blur(8px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            cursor: pointer;
            transition: opacity 0.5s ease;
        }
        #startOverlay h1 {
            font-size: 24px;
            font-weight: 400;
            letter-spacing: 2px;
            margin-bottom: 12px;
            color: #e2e8f0;
        }
        #startOverlay p {
            font-size: 14px;
            color: #94a3b8;
        }
        #endCard {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(5, 7, 10, 0.92);
            backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 1.5s ease;
            z-index: 5;
        }
        #endCard.visible {
            opacity: 1;
            pointer-events: auto;
        }
        #endCard h2 {
            font-size: 28px;
            font-weight: 300;
            letter-spacing: 4px;
            color: #f1f5f9;
            margin-bottom: 20px;
        }
        button {
            padding: 10px 24px;
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #ffffff;
            border-radius: 30px;
            font-size: 13px;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        button:hover {
            background: #ffffff;
            color: #080a0f;
        }
    </style>
</head>
<body>

    <div id="viewport">
        <canvas id="stage" width="854" height="480"></canvas>
        
        <div id="startOverlay" onclick="startExperience()">
            <h1>CINEMATIC ANIMATION</h1>
            <p>Click anywhere to start with audio</p>
        </div>

        <div id="endCard">
            <h2>ALWAYS BY YOUR SIDE</h2>
            <button onclick="resetMovie()">REPLAY</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('stage');
        const ctx = canvas.getContext('2d');
        const width = canvas.width;
        const height = canvas.height;

        let audioCtx;
        let rainGainNode;
        let isStarted = false;

        function initAudio() {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            
            // Web Audio procedural rain synthesis
            const bufferSize = audioCtx.sampleRate * 2;
            const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const output = noiseBuffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) {
                output[i] = Math.random() * 2 - 1;
            }

            const whiteNoise = audioCtx.createBufferSource();
            whiteNoise.buffer = noiseBuffer;
            whiteNoise.loop = true;

            const filter = audioCtx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.value = 800;

            rainGainNode = audioCtx.createGain();
            rainGainNode.gain.setValueAtTime(0.2, audioCtx.currentTime);

            whiteNoise.connect(filter);
            filter.connect(rainGainNode);
            rainGainNode.connect(audioCtx.destination);
            whiteNoise.start();
        }

        function fadeRainSound() {
            if (rainGainNode && audioCtx) {
                rainGainNode.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 3.5);
            }
        }

        function playVoiceBlip(isBoy) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            
            osc.type = isBoy ? 'sine' : 'triangle';
            osc.frequency.setValueAtTime(isBoy ? 140 : 260, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(isBoy ? 110 : 220, audioCtx.currentTime + 0.12);
            
            gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.12);
            
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.12);
        }

        const scene = {
            cameraScale: 1.0,
            targetScale: 1.0,
            cameraY: 0,
            targetY: 0,
            rainOpacity: 1.0,
            warmth: 0.0,
            dialogue: { text: "", speaker: null, opacity: 0, targetOpacity: 0 },
            particles: [],
            splashes: [],
            raindrops: Array.from({ length: 160 }, () => ({
                x: Math.random() * width * 1.5 - width * 0.25,
                y: Math.random() * height,
                speed: 12 + Math.random() * 8,
                length: 15 + Math.random() * 10
            })),
            boy: { x: width * 0.495, y: 350, hugging: true },
            girl: { x: width * 0.51, y: 350, hugging: true, crying: false, comforted: true }
        };

        const wait = ms => new Promise(res => setTimeout(res, ms));

        async function showDialogue(text, speaker) {
            scene.dialogue.text = text;
            scene.dialogue.speaker = speaker;
            scene.dialogue.targetOpacity = 1;
            playVoiceBlip(speaker === 'boy');
        }

        async function hideDialogue() {
            scene.dialogue.targetOpacity = 0;
        }

        // Draw anatomically complete realistic silhouettes
        function drawRealisticCharacters() {
            const bx = scene.boy.x;
            const by = scene.boy.y;

            // Ground Shadow
            ctx.fillStyle = "rgba(0, 0, 0, 0.4)";
            ctx.beginPath();
            ctx.ellipse(bx, by + 12, 70, 16, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.save();
            ctx.translate(bx, by);

            // 1. Girl's lower body lying on ground (extended behind boy)
            ctx.fillStyle = "#1e293b"; // Dark trousers
            ctx.beginPath();
            ctx.moveTo(10, 5);
            ctx.quadraticCurveTo(40, 8, 75, 10); // Right leg extended on ground
            ctx.lineTo(70, -3);
            ctx.quadraticCurveTo(35, -2, 5, -8);
            ctx.closePath();
            ctx.fill();

            // 2. Boy's Complete Body (Kneeling Hugging Anatomy)
            // Back Leg & Foot
            ctx.fillStyle = "#0f172a";
            ctx.beginPath();
            ctx.moveTo(-45, 10);
            ctx.lineTo(-20, 10);
            ctx.lineTo(-10, -25);
            ctx.lineTo(-35, -25);
            ctx.closePath();
            ctx.fill();

            // Front Leg (Kneeling stance)
            ctx.fillStyle = "#1e293b";
            ctx.beginPath();
            ctx.moveTo(-35, -25);
            ctx.lineTo(-10, 10);
            ctx.lineTo(15, 10);
            ctx.lineTo(-5, -30);
            ctx.closePath();
            ctx.fill();

            // Boy's Torso
            ctx.fillStyle = "#334155";
            ctx.beginPath();
            ctx.moveTo(-30, -30);
            ctx.quadraticCurveTo(-35, -60, -22, -85); // Back curve
            ctx.lineTo(8, -75); // Shoulder line
            ctx.lineTo(2, -30); // Front chest line
            ctx.closePath();
            ctx.fill();

            // 3. Girl's Torso & Head (Leaning into boy's lap/chest)
            ctx.fillStyle = "#475569"; // Sweater
            ctx.beginPath();
            ctx.moveTo(-5, -30);
            ctx.quadraticCurveTo(15, -40, 30, -25);
            ctx.lineTo(15, -10);
            ctx.closePath();
            ctx.fill();

            // Girl's Head & Wet Hair Details
            ctx.fillStyle = "#fbcfe8"; // Soft skin tone
            ctx.beginPath();
            ctx.arc(8, -52, 11, 0, Math.PI * 2);
            ctx.fill();

            // Girl's Closed Peaceful Eye
            ctx.strokeStyle = "#475569";
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.arc(12, -52, 3, 0.2 * Math.PI, 0.8 * Math.PI);
            ctx.stroke();

            // Girl's Hair Flowing Down
            ctx.fillStyle = "#0f172a";
            ctx.beginPath();
            ctx.moveTo(3, -62);
            ctx.quadraticCurveTo(25, -65, 30, -35);
            ctx.quadraticCurveTo(35, -20, 45, -5);
            ctx.quadraticCurveTo(20, -35, 0, -50);
            ctx.closePath();
            ctx.fill();

            // 4. Boy's Head & Face Profile
            ctx.fillStyle = "#fde047"; // Soft warm skin glow
            ctx.beginPath();
            ctx.arc(-18, -95, 13, 0, Math.PI * 2);
            ctx.fill();

            // Boy's Face Profile Details (Nose/Jawline)
            ctx.fillStyle = "#fde047";
            ctx.beginPath();
            ctx.moveTo(-10, -100);
            ctx.lineTo(-5, -93); // Nose
            ctx.lineTo(-9, -87); // Mouth/Chin
            ctx.lineTo(-18, -82);
            ctx.closePath();
            ctx.fill();

            // Boy's Closed Comforting Eye
            ctx.strokeStyle = "#334155";
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.arc(-8, -95, 3, 0.2 * Math.PI, 0.8 * Math.PI);
            ctx.stroke();

            // Boy's Hair
            ctx.fillStyle = "#1e1b4b";
            ctx.beginPath();
            ctx.arc(-20, -98, 14, 0.8 * Math.PI, 1.9 * Math.PI);
            ctx.quadraticCurveTo(-10, -115, -4, -100);
            ctx.closePath();
            ctx.fill();

            // 5. Interlocking Hugging Arms (Embrace Realism)
            // Girl's arm reaching around boy's waist
            ctx.strokeStyle = "#fbcfe8";
            ctx.lineWidth = 5;
            ctx.lineCap = "round";
            ctx.beginPath();
            ctx.moveTo(20, -30);
            ctx.quadraticCurveTo(-5, -35, -20, -45);
            ctx.stroke();

            // Boy's right arm fully wrapping girl's shoulders
            ctx.strokeStyle = "#334155";
            ctx.lineWidth = 9;
            ctx.beginPath();
            ctx.moveTo(-20, -78);
            ctx.quadraticCurveTo(-2, -70, 12, -58);
            ctx.quadraticCurveTo(22, -45, 15, -30);
            ctx.stroke();

            // Boy's hand resting gently on girl's back
            ctx.fillStyle = "#fde047";
            ctx.beginPath();
            ctx.arc(14, -30, 5, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();
        }

        function drawSpeechBubble() {
            if (scene.dialogue.opacity <= 0.01) return;

            ctx.save();
            ctx.globalAlpha = scene.dialogue.opacity;

            const isBoy = scene.dialogue.speaker === 'boy';
            const bx = isBoy ? scene.boy.x - 30 : scene.boy.x + 30;
            const by = isBoy ? scene.boy.y - 130 : scene.boy.y - 90;

            // Dynamic Active Speaker Indicator Glow
            ctx.shadowColor = isBoy ? "rgba(56, 189, 248, 0.6)" : "rgba(244, 114, 182, 0.6)";
            ctx.shadowBlur = 15;

            // Speech Bubble Container
            ctx.fillStyle = "rgba(15, 23, 42, 0.88)";
            ctx.strokeStyle = isBoy ? "rgba(56, 189, 248, 0.4)" : "rgba(244, 114, 182, 0.4)";
            ctx.lineWidth = 1.5;

            const textExtra = ctx.measureText(scene.dialogue.text).width;
            const bubbleWidth = Math.max(120, textExtra + 30);
            const bubbleHeight = 36;
            const rx = bx - bubbleWidth / 2;
            const ry = by - bubbleHeight / 2;

            ctx.beginPath();
            ctx.roundRect(rx, ry, bubbleWidth, bubbleHeight, 18);
            ctx.fill();
            ctx.stroke();

            // Pointer Tail pointing to speaker face
            ctx.beginPath();
            if (isBoy) {
                ctx.moveTo(bx - 5, ry + bubbleHeight);
                ctx.lineTo(bx - 12, ry + bubbleHeight + 10);
                ctx.lineTo(bx + 5, ry + bubbleHeight);
            } else {
                ctx.moveTo(bx - 5, ry + bubbleHeight);
                ctx.lineTo(bx + 12, ry + bubbleHeight + 10);
                ctx.lineTo(bx + 5, ry + bubbleHeight);
            }
            ctx.fillStyle = "rgba(15, 23, 42, 0.88)";
            ctx.fill();

            // Speaker Tag Indicator
            ctx.shadowBlur = 0;
            ctx.font = "600 10px -apple-system, sans-serif";
            ctx.fillStyle = isBoy ? "#38bdf8" : "#f472b6";
            ctx.fillText(isBoy ? "BOY" : "GIRL", rx + 14, ry - 6);

            // Dialogue Text
            ctx.font = "400 13px -apple-system, sans-serif";
            ctx.fillStyle = "#f8fafc";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText(scene.dialogue.text, bx, by);

            ctx.restore();
        }

        function renderFrame() {
            // Smooth Camera Interpolation (Lerp)
            scene.cameraScale += (scene.targetScale - scene.cameraScale) * 0.04;
            scene.cameraY += (scene.targetY - scene.cameraY) * 0.04;
            scene.dialogue.opacity += (scene.dialogue.targetOpacity - scene.dialogue.opacity) * 0.1;

            ctx.clearRect(0, 0, width, height);
            ctx.save();

            // Apply Camera Zoom & Shift
            ctx.translate(width / 2, height / 2);
            ctx.scale(scene.cameraScale, scene.cameraScale);
            ctx.translate(-width / 2, -height / 2 + scene.cameraY);

            // Dynamic Background Lighting (Transitions rainy cold blue -> warm ambient)
            const bgGradient = ctx.createLinearGradient(0, 0, 0, height);
            const r = Math.floor(11 + scene.warmth * 35);
            const g = Math.floor(15 + scene.warmth * 25);
            const b = Math.floor(25 + scene.warmth * 15);
            bgGradient.addColorStop(0, `rgb(${r}, ${g}, ${b})`);
            bgGradient.addColorStop(1, `rgb(${Math.floor(r*0.5)}, ${Math.floor(g*0.5)}, ${Math.floor(b*0.5)})`);
            ctx.fillStyle = bgGradient;
            ctx.fillRect(0, 0, width, height);

            // Wet Ground Plane
            ctx.fillStyle = "#090d16";
            ctx.fillRect(0, 350, width, 130);

            // Ground Wet Reflection / Puddle
            if (scene.rainOpacity > 0.05) {
                const puddleGlow = ctx.createRadialGradient(width*0.5, 360, 10, width*0.5, 360, 150);
                puddleGlow.addColorStop(0, `rgba(56, 189, 248, ${0.12 * scene.rainOpacity})`);
                puddleGlow.addColorStop(1, "rgba(0, 0, 0, 0)");
                ctx.fillStyle = puddleGlow;
                ctx.fillRect(0, 340, width, 50);
            }

            // Characters Rendering
            drawRealisticCharacters();

            // Rain System & Localized Ground Splashes
            if (scene.rainOpacity > 0.01) {
                ctx.strokeStyle = `rgba(186, 230, 253, ${0.35 * scene.rainOpacity})`;
                ctx.lineWidth = 1.2;
                ctx.beginPath();
                scene.raindrops.forEach(drop => {
                    drop.y += drop.speed;
                    if (drop.y > 350) {
                        // Create splash at ground level where girl is lying
                        if (Math.random() < 0.3) {
                            scene.splashes.push({
                                x: drop.x,
                                y: 350 + Math.random() * 8,
                                radius: 1,
                                alpha: 0.8 * scene.rainOpacity
                            });
                        }
                        drop.y = -20;
                        drop.x = Math.random() * width * 1.5 - width * 0.25;
                    } else {
                        ctx.moveTo(drop.x, drop.y);
                        ctx.lineTo(drop.x - 2, drop.y + drop.length);
                    }
                });
                ctx.stroke();

                // Render Rain Splashes / Ripples
                scene.splashes.forEach((splash, i) => {
                    ctx.strokeStyle = `rgba(224, 242, 254, ${splash.alpha})`;
                    ctx.lineWidth = 0.8;
                    ctx.beginPath();
                    ctx.ellipse(splash.x, splash.y, splash.radius * 2, splash.radius * 0.6, 0, 0, Math.PI * 2);
                    ctx.stroke();
                    splash.radius += 0.4;
                    splash.alpha -= 0.04;
                    if (splash.alpha <= 0) scene.splashes.splice(i, 1);
                });
            }

            // Floating Warm Particles (Hearts / Comfort Embers)
            scene.particles.forEach((p, index) => {
                p.y -= p.speed;
                p.x += Math.sin(p.y * 0.05) * 0.5;
                p.alpha -= 0.003;
                if (p.alpha <= 0) scene.particles.splice(index, 1);

                ctx.save();
                ctx.globalAlpha = Math.max(0, p.alpha);
                ctx.fillStyle = "#f472b6";
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            });

            // Active Speaker Speech Bubble
            drawSpeechBubble();

            ctx.restore();
            requestAnimationFrame(renderFrame);
        }

        async function playScene() {
            // SCENE 5: REALISTIC HUG & RAIN STOPS
            scene.boy.hugging = true;
            scene.girl.hugging = true;
            scene.girl.comforted = true;
            scene.girl.crying = false;
            scene.boy.x = width * 0.495;

            // Camera zoom into hug
            scene.targetScale = 1.45;
            scene.targetY = -25;

            // Fade Rain Out & Warm Background Up
            fadeRainSound();
            let fadeInterval = setInterval(() => {
                scene.rainOpacity -= 0.02;
                scene.warmth += 0.02;
                if (scene.rainOpacity <= 0) {
                    scene.rainOpacity = 0;
                    clearInterval(fadeInterval);
                }
            }, 100);

            // Hearts Spawn
            let heartSpawner = setInterval(() => {
                scene.particles.push({
                    x: scene.girl.x + (Math.random() * 40 - 20),
                    y: scene.girl.y - 40,
                    size: 1.5 + Math.random() * 2,
                    speed: 0.5 + Math.random() * 0.6,
                    alpha: 0.9
                });
            }, 400);

            await wait(1500);
            await showDialogue('«I\'ve got you.»', 'boy');
            await wait(2800);
            await showDialogue('«Thank you for staying.»', 'girl');
            await wait(3000);
            await showDialogue('«Always.»', 'boy');
            await wait(3500);
            await hideDialogue();

            // Long hug hold
            await wait(4000);
            clearInterval(heartSpawner);

            // SCENE 6: FINAL MESSAGE CARD
            document.getElementById('endCard').classList.add('visible');
        }

        function startExperience() {
            if (isStarted) return;
            isStarted = true;
            document.getElementById('startOverlay').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('startOverlay').style.display = 'none';
            }, 500);
            
            initAudio();
            playScene();
        }

        function resetMovie() {
            window.location.reload();
        }

        // Start render loop
        requestAnimationFrame(renderFrame);
    </script>
</body>
</html>
